[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-hardware-enumerator"
version = "0.2.0"
description = "Evidence-oriented Linux hardware discovery with machine-readable output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
linux-hardware-enumerator = "hw_enum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
