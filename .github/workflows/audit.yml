name: Hardware Enumerator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q src tools
      - name: Audit machine-readable inventory
        run: python tools/inventory_audit.py
      - name: Audit JSON CLI
        run: python tools/cli_audit.py
